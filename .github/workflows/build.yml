name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      abi:
        description: 'Comma-separated ABIs to build'
        default: 'arm64-v8a'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: debug apk (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Submodules at their pinned commits (shallow)
        run: .github/scripts/init-submodules.sh "$GITHUB_WORKSPACE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug -PabiFilters="$ABI"

      - name: Rename apk
        id: apk
        run: |
          src=$(ls TMessagesProj_App/build/outputs/apk/afat/debug/*.apk | head -1)
          out="Telegram-beta-${ABI//,/-}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} ($ABI debug)" \
            --notes "Debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Package org.telegram.messenger.beta; installs alongside Telegram." \
            "${{ steps.apk.outputs.path }}"
